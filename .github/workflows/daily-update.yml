name: Daily Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-update.yml"
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - "tests/**"
  schedule:
    # Keep the daily run away from the top of the hour to reduce scheduler congestion.
    - cron: "23 11 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: livealt-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install frontend dependencies
        run: npm ci --prefix site

      - name: Run tests
        run: pytest -q

      - name: Run pipeline
        run: python -m livealt.cli --config config/settings.yaml run

      - name: Validate outputs
        run: python -m livealt.cli --config config/settings.yaml validate

      - name: Commit updated data artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data outputs site/public/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily market breadth update"
            git push
          fi

      - name: Build site
        env:
          VITE_SOURCE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm --prefix site run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
